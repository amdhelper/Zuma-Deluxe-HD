name: release

# 打 tag（v0.2.0 这种）→ 构建 → 出包 → 自动发到 GitHub Release 页
# 手动补发：Actions 页面点 Run workflow，填 tag
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（例如 v0.2.0，需已存在）'
        required: true

permissions:
  contents: write     # 创建 Release 需要

jobs:
  build-and-release:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 出包脚本要用 git describe 取版本号

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config patchelf \
            libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev \
            libexpat1-dev libgl1-mesa-dev \
            dpkg-dev python3-pil

      - name: 取 SDL_ttf（external/SDL_ttf 是 gitlink，仓库没有 .gitmodules）
        run: |
          rm -rf external/SDL_ttf
          # SDL2 分支（2.25.x，与仓库内 vendored 同线）；失败则退回系统 libsdl2-ttf
          git clone --depth 1 --branch SDL2 \
            https://github.com/libsdl-org/SDL_ttf.git external/SDL_ttf \
            || echo "SDL_ttf clone 失败，改用系统库"

      - name: 构建
        run: |
          rm -rf build                     # 仓库历史里跟踪过 build/，清掉避免旧 CMakeCache 报 source mismatch
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: 冒烟：无头自动测试（通关 + 掉命）
        working-directory: build/bin
        run: |
          set -o pipefail
          ./ZumaHD --autotest --frames 30000 --levels 1 --stage 1 --level 1 | tee /tmp/smoke.log
          grep -q "LEVEL_COMPLETE" /tmp/smoke.log
          ./ZumaHD --autotest --no-autoplay --frames 9000 --stage 1 --level 1 | tee /tmp/smoke2.log
          grep -q "BALL_INTO_PIT" /tmp/smoke2.log

      - name: 出包（tar.gz + deb + 校验和）
        env:
          # workflow_dispatch 时 GITHUB_REF_NAME=master，必须用输入的 tag 当版本号
          # （deb 要求版本号以数字开头，否则直接报错）
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="${VERSION#v}" scripts/package_linux.sh
          ls -la dist/

      - name: 生成 Release（标题 + 说明 + 附件）
        env:
          GH_TOKEN: ${{ github.token }}
          REL_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          TAG="$REL_TAG"
          NOTES=dist/RELEASE_NOTES.md
          cp docs/RELEASE_NOTES.md "$NOTES"
          sed -i "s/@VERSION@/${TAG#v}/g" "$NOTES"

          gh release create "$TAG" \
            --title "Zuma Deluxe HD ${TAG#v}" \
            --notes-file "$NOTES" \
            dist/zuma-deluxe-hd-*.tar.gz \
            dist/zuma-deluxe-hd_*.deb \
            dist/sha256sums.txt \
          || gh release upload "$TAG" \
            dist/zuma-deluxe-hd-*.tar.gz \
            dist/zuma-deluxe-hd_*.deb \
            dist/sha256sums.txt --clobber

  # ── Windows x64（MSYS2 + mingw-w64 交叉打包）─────────────────────────────
  # Windows x64：仓库自带 lib/bass/x64/bass.dll（BASS 官方 Windows 包，见
  # lib/bass/LICENSE-windows.txt），CMake 的 WIN32 分支会链接它并定义 ZUMA_NO_BASSFX。
  windows:
    needs: build-and-release
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
            mingw-w64-x86_64-SDL2 mingw-w64-x86_64-SDL2_image mingw-w64-x86_64-SDL2_ttf
            mingw-w64-x86_64-expat zip

      - name: 构建（MINGW64）
        run: |
          rm -rf build-win64 && mkdir build-win64
          cmake -S . -B build-win64 -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-win64

      - name: 出包并上传到 Release
        env:
          GH_TOKEN: ${{ github.token }}
          REL_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="${REL_TAG#v}"
          OUT="dist/zuma-deluxe-hd-${VERSION}-win64"
          rm -rf "$OUT"; mkdir -p "$OUT"

          cp build-win64/bin/ZumaHD.exe "$OUT/"
          cp -r content/* "$OUT/"
          cp lib/bass/x64/bass.dll "$OUT/" 2>/dev/null || true
          cp lib/bass-fx/libs/x64/bass_fx.dll "$OUT/" 2>/dev/null || true

          BIN="$(cygpath -u "${MINGW_PREFIX}")/bin"
          for d in SDL2.dll SDL2_image.dll SDL2_ttf.dll libpng16-16.dll zlib1.dll \
                   libjpeg-8.dll libwebp-7.dll libtiff-5.dll libexpat-1.dll; do
              cp "$BIN/$d" "$OUT/" 2>/dev/null || true
          done

          printf '@echo off\r\ncd /d "%%~dp0"\r\nstart "" ZumaHD.exe\r\n' > "$OUT/玩祖玛.bat"

          cd dist
          zip -qr "$(basename "$OUT").zip" "$(basename "$OUT")"
          sha256sum "$(basename "$OUT").zip" >> sha256sums.txt

      # MSYS2 里没有 gh，上传单独用 Windows 上预装的 GitHub CLI（pwsh）
      - name: 上传 zip 到 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REL_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $ver = $env:REL_TAG.TrimStart('v')
          gh release upload $env:REL_TAG "dist/zuma-deluxe-hd-$ver-win64.zip" --clobber
          gh release view $env:REL_TAG --json assets -q '.assets[].name'
